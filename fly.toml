# fly.toml app configuration file generated for rails-websocket-client on 2026-05-11T21:28:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rails-websocket-client'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  # DATABASE_URL is injected by Fly's Supabase Managed Postgres add-on; do not
  # hard-code it here. The Go listener picks Postgres automatically when this
  # var is set (see script/go-websockets/main.go).
  HTTP_PORT = '8080'
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = '1'
  RAILS_SERVE_STATIC_FILES = '1'
  REGION = 'tyo'
  SOLID_QUEUE_IN_PUMA = 'true'
  WS_URL = 'wss://stream.binance.com:9443/ws/btcusdt@trade'

[processes]
  app = '/rails/bin/fly-start'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
