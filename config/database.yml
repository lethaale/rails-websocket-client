# Postgres everywhere. Rails' multi-database support gives us four logical
# databases (primary, cache, queue, cable) that can either be four databases
# on the same host (dev/test) or be wired to different DATABASE_URLs in prod.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Solid Queue runs more threads than Puma (10 workers + dispatcher/supervisor),
# so the queue connection needs a larger pool than the default.
queue_default: &queue_default
  <<: *default
  pool: <%= ENV.fetch("QUEUE_DB_POOL", 15) %>

development:
  primary:
    <<: *default
    database: rails_websocket_client_development
  cache:
    <<: *default
    database: rails_websocket_client_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *queue_default
    database: rails_websocket_client_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_websocket_client_development_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and re-generated from
# your development database when you run "rake". Do not set this db to the same
# as development or production.
test:
  <<: *default
  database: rails_websocket_client_test

# Production wires each Rails database to its own URL. Fly's Supabase add-on
# only injects DATABASE_URL; provision QUEUE_DATABASE_URL / CABLE_DATABASE_URL /
# CACHE_DATABASE_URL as additional secrets pointing at separate databases on
# the same Postgres server (see DEPLOY.md).
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *queue_default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
