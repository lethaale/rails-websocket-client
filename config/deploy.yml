# Shared Kamal config. Provider-agnostic — works on any host you can SSH into.
#
# Multi-region workflow:
#   1. Provision a box (DigitalOcean, Hetzner, Vultr, AWS Lightsail, ...).
#   2. Copy config/deploy.example.yml to config/deploy.<region>.yml and fill in the IP.
#   3. Build & push the listener image once: docker buildx build --push --platform linux/amd64 \
#        -t <docker_user>/rails_websocket_client_listener:latest script/go-websockets/
#   4. Deploy: bin/kamal deploy -d <region>      (e.g. nyc, fra, sgp)

service: rails_websocket_client

# Replace <docker_user> with your Docker Hub username (or any registry path).
image: <docker_user>/rails_websocket_client

# Per-region destination files (deploy.<region>.yml) MUST override:
#   servers.web                       — the region's IP
#   accessories.listener.host         — same IP
#   env.clear.REGION                  — short label shown in the UI (e.g. nyc)
#   proxy.host (optional)             — sslip.io subdomain or your own DNS
servers:
  web:
    - <SET IN DESTINATION FILE>

# No SSL by default — sslip.io / nip.io let you skip DNS for a demo.
# Set proxy.ssl: true and a real host once you have a domain.
proxy:
  ssl: false
  host: <SET IN DESTINATION FILE>

registry:
  server: docker.io
  username: <docker_user>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    # REGION is set per destination file; the UI reads it to show which box served the page.
    REGION: local

# Bind-mount a host directory so the Rails container and the Go listener share the SQLite files.
volumes:
  - "/var/lib/rails_websocket_client/storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

# Go listener runs as a sidecar accessory on the same host, writing into the shared volume.
# Build & push its image manually (see comment at the top of this file).
accessories:
  listener:
    image: <docker_user>/rails_websocket_client_listener:latest
    host: <SET IN DESTINATION FILE>
    env:
      clear:
        DB_PATH: /storage/queue.sqlite3
        WS_URL: wss://stream.binance.com:9443/ws/btcusdt@trade
    volumes:
      - "/var/lib/rails_websocket_client/storage:/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole --include-password"
